# Local stack. Start with: docker compose up -d
services:
  mongo:
    image: mongo:8.0
    container_name: aidevops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Enabled once server/Dockerfile exists (Week 1).
  # server:
